# =============================================================================
# SealKeeper — Release Pipeline
# =============================================================================
# Trigger: push of an annotated, GPG-signed tag matching v*.*.*
#
# PRD references:
#   - FR-L.46  (release.yml on tag v*.*.*)
#   - FR-L.56  (SemVer 2.0 strict)
#   - FR-L.63  (tag must be GPG-signed; pipeline refuses otherwise)
#   - FR-L.64  (GPG sign SHA256SUMS via maintainer key)
#   - FR-L.65  (cosign keyless image signing, Rekor transparency log)
#   - FR-L.66  (SBOM CycloneDX 1.5 via syft — binaries + image)
#   - FR-L.67  (SLSA level 2 provenance via GitHub OIDC + cosign)
#   - FR-L.35  (Trivy/Grype scan, block on high/critical CVE)
#   - FR-L.27-28 (E2E full multi-browser + axe-core a11y)
#   - FR-L.52  (target < 30 min for release)
#   - FR-L.69  (verification doc references this pipeline)
#   - FR-H.3   (image ghcr.io/sched75-org/sealkeeper:<version> + :latest)
#   - FR-H.16  (multi-arch linux/amd64 + linux/arm64)
#   - FR-H.18-19 (distroless/static, UID 65532)
#   - FR-H.20-27 (Compose bundle reference)
#   - FR-H.43-45 (Caddy / Traefik / Nginx examples in bundle)
#   - FR-H.28-37 (Helm chart packaging)
#   - D-L.21   (post-release smoke test image alone)
#
# CRITICAL ADDITIONS over the bare PRD:
#   1. Deployment bundle assembly (tarball + zip)
#   2. End-to-end smoke test of the Compose bundle BEFORE the GitHub Release is
#      published. Any failure aborts the release.
#
# DECISION: jobs are decomposed so heavy work (binaries, image, bundle) can run
#   in parallel. The terminal `release` job depends on every upstream job and is
#   the only one that actually publishes the GitHub Release — this guarantees a
#   single point of "publish" that we can gate on the smoke tests.
#
# SUPPLY-CHAIN HARDENING (SK-21):
#   - Tag push is the ONLY trigger. The former `workflow_dispatch` path verified
#     the tag named in its input but built `github.sha` of whatever branch it
#     was started from, then signed that under the verified tag's name. A failed
#     release is re-run from the tag-push run ("Re-run jobs"), which keeps the
#     cosign identity bound to `refs/tags/<version>`.
#   - Every job checks out `refs/tags/<version>` explicitly and asserts that
#     HEAD is the commit the verified tag points to.
#   - No `${{ }}` expression is interpolated inside a `run:` script: values
#     travel through `env:` and are referenced as quoted shell variables.
#   - Jobs that sign or publish (build-image, sign-binaries, release) run in the
#     protected `release` environment. The maintainer GPG secrets MUST be
#     environment secrets of that environment, not repository secrets.
#     Required repository settings (Settings → Environments → `release`):
#       * Required reviewers: at least one maintainer, "Prevent self-review" on.
#       * Deployment branches and tags: "Selected" → tag pattern `v*.*.*` only.
#       * Environment secrets: MAINTAINER_GPG_PRIVATE, MAINTAINER_GPG_PASSPHRASE,
#         HELM_REPO_URL / HELM_REPO_USER / HELM_REPO_TOKEN (delete any
#         repository-level copies).
#     And Settings → Rules → Tag ruleset on `v*.*.*`: restrict creation,
#     update and deletion to maintainers.
#   - Permissions default to `contents: read`; each job adds only what it needs.
#   - Third-party actions are pinned by commit SHA; syft and trivy are fetched
#     from pinned release assets and checked against a hard-coded SHA-256.
#   - Release builds do not consume GitHub Actions caches (cache poisoning).
#   - build-image pushes the image BY DIGEST only: no tag exists until every
#     gate (JS bundle assertion, Trivy, smoke-bundle, smoke-image) has passed
#     against that digest. The terminal `release` job then points the
#     human-facing tags at the gated digest with `docker buildx imagetools
#     create` (:vX.Y.Z, :X.Y.Z, and :latest only for non-prerelease tags),
#     so a failed gate or an -rc tag never moves :latest.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  NODE_VERSION: "20"
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/sealkeeper
  COSIGN_VERSION: v2.4.1
  # syft + trivy: pinned release asset + SHA-256 of that asset. Bump both
  # values together (sha256 from the upstream *_checksums.txt, cross-checked
  # against a local download).
  SYFT_VERSION: "1.18.1"
  SYFT_SHA256: "066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab"
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "b6d7b944b6cbf4e7de5b4bc6c3635900c50fed53b64b77b99a5fbc3136cd1d5d"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Verify tag — annotated + GPG-signed (FR-L.63)
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      version_nopv: ${{ steps.parse.outputs.version_nopv }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Checkout (tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse and validate SemVer
        id: parse
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "::error::Release must be triggered by a tag push (got '$GITHUB_REF')"; exit 1 ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not strict SemVer (vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "version_nopv=${tag#v}" >> "$GITHUB_OUTPUT"
          # SemVer prerelease (vX.Y.Z-rc.1): marked prerelease on GitHub and
          # never tagged :latest.
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Import maintainer GPG public key
        env:
          # MAINTAINER_GPG_PUBLIC: ASCII-armored public key block of the release
          # signing key. The fingerprint is also pinned via MAINTAINER_GPG_FPR
          # and re-checked below.
          MAINTAINER_GPG_PUBLIC: ${{ secrets.MAINTAINER_GPG_PUBLIC }} # TODO: configure secret MAINTAINER_GPG_PUBLIC
        run: |
          set -euo pipefail
          printf '%s\n' "$MAINTAINER_GPG_PUBLIC" | gpg --import

      - name: Verify tag is annotated and GPG-signed
        id: verify
        env:
          TAG: ${{ steps.parse.outputs.version }}
          EXPECTED_FPR: ${{ secrets.MAINTAINER_GPG_FPR }} # TODO: configure secret MAINTAINER_GPG_FPR
        run: |
          set -euo pipefail
          ref="refs/tags/${TAG}"
          # actions/checkout rewrites refs/tags/<tag> to point straight at
          # the commit (`+<sha>:refs/tags/<tag>`), which turns an annotated
          # tag into a lightweight one. Fetch the real tag object back.
          git fetch --force --no-tags origin "${ref}:${ref}"
          # Reject lightweight tags (object type must be 'tag', not 'commit').
          if [ "$(git cat-file -t "$ref")" != "tag" ]; then
            echo "::error::Tag '$TAG' is lightweight; only annotated, signed tags are accepted"
            exit 1
          fi
          # Reject unsigned annotated tags.
          if ! git verify-tag "$ref" 2>&1 | tee /tmp/verify.log; then
            echo "::error::Tag '$TAG' is not signed by a trusted GPG key"
            exit 1
          fi
          # Optional fingerprint pinning.
          if [ -n "$EXPECTED_FPR" ]; then
            if ! grep -F "$EXPECTED_FPR" /tmp/verify.log >/dev/null; then
              echo "::error::Tag signing key does not match pinned fingerprint"
              exit 1
            fi
          else
            echo "::warning::MAINTAINER_GPG_FPR is not set — any key in MAINTAINER_GPG_PUBLIC is accepted"
          fi
          # The commit every downstream job must build. On a tag push it is
          # also github.sha; refuse to continue if the two ever disagree.
          commit="$(git rev-parse "${ref}^{commit}")"
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::Tag '$TAG' points to $commit but the run was triggered for $GITHUB_SHA"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Full tests — including E2E multi-browser + axe-core a11y (FR-L.27, 28)
  # ---------------------------------------------------------------------------
  test-full:
    name: Full test suite (E2E multi-browser + a11y)
    # Pinned like ci.yml's e2e-subset: the pinned Playwright cannot install
    # its browsers on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    needs: [verify-tag]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.version }}
          persist-credentials: false

      - name: Assert HEAD is the verified tag commit
        env:
          EXPECTED_SHA: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual, expected verified tag commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Go tests (race + cover)
        run: |
          set -euo pipefail
          # See ci.yml for the rationale on filtering by TestGoFiles: avoids
          # `go: no such tool "covdata"` on test-less packages.
          PKGS=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)
          go test -race -covermode=atomic -coverpkg=./... \
            -coverprofile=coverage.out $PKGS

      - name: JS tests (Vitest + ≥90% coverage)
        if: hashFiles('web/package-lock.json') != ''
        run: |
          cd web
          npm ci
          npx vitest run --coverage

      - name: Build JS bundle and server binary for E2E
        # playwright.config.ts serves SK_WEB_DIR=web/dist, and a prebuilt
        # binary (SEALKEEPER_BIN) keeps `go run` compile time out of
        # Playwright's 60 s webServer start budget.
        run: |
          set -euo pipefail
          (cd web && npm run build)
          test -s web/dist/sealkeeper-generation.umd.js
          go build -o dist/sealkeeper-e2e ./cmd/sealkeeper

      - name: Install Playwright (Chromium, Firefox, WebKit)
        if: hashFiles('tests/e2e/package-lock.json') != ''
        run: |
          cd tests/e2e
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: E2E full + axe-core
        if: hashFiles('tests/e2e/package-lock.json') != ''
        env:
          SEALKEEPER_BIN: ${{ github.workspace }}/dist/sealkeeper-e2e
          # Headroom for CI retries; the per-email limit stays at its default
          # because the FR-B.13 rate-limit test relies on it.
          SK_RATE_LIMIT_IP_PER_HOUR: "1000"
        # One run per browser: each run starts a fresh server, so the
        # in-memory rate limiters do not carry over from one browser to the
        # next. screenshots.spec.ts is a manual job (needs an admin password).
        run: |
          set -euo pipefail
          cd tests/e2e
          status=0
          for project in chromium firefox webkit; do
            npx playwright test --project="$project" --grep-invert @screenshots               --output="test-results/$project" || status=1
          done
          exit "$status"

      - name: Upload E2E artifacts on failure
        if: failure() && hashFiles('tests/e2e/package-lock.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Build multi-arch binaries (linux/darwin × amd64/arm64)
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [verify-tag]
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.version }}
          persist-credentials: false

      - name: Assert HEAD is the verified tag commit
        env:
          EXPECTED_SHA: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual, expected verified tag commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Signed artefacts are built from a clean module cache.
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A standalone binary has no web directory next to it: the reveal
      # page's JS bundle is embedded via internal/webbundle (go:embed).
      # Same flags as the Dockerfile webbuild stage.
      - name: Build and embed JS bundle
        working-directory: web
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/sealkeeper-generation.umd.js
          test -s dist/sealkeeper-generation.umd.js.map
          cp dist/sealkeeper-generation.umd.js dist/sealkeeper-generation.umd.js.map \
            ../internal/webbundle/dist/

      - name: Build reproducibly
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # -trimpath + reproducible ldflags (FR-L.68, eyes on SLSA L3 v0.3):
          # the build date is the commit date, not the wall clock.
          pkg=github.com/sched75/sealkeeper/internal/version
          commit="$(git rev-parse --short HEAD)"
          date="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          go build -trimpath -buildvcs=true \
            -ldflags "-s -w -X ${pkg}.Version=${VERSION} -X ${pkg}.Commit=${commit} -X ${pkg}.BuildDate=${date}" \
            -o "dist/sealkeeper-${GOOS}-${GOARCH}" \
            ./cmd/sealkeeper

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/sealkeeper-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Build & push multi-arch OCI image (distroless), scan, sign, SBOM
  #    Protected environment: pushes to GHCR and signs with the repo identity.
  #    The image is pushed by digest, untagged; tags are added by `release`.
  # ---------------------------------------------------------------------------
  build-image:
    name: Build & sign OCI image
    runs-on: ubuntu-latest
    needs: [verify-tag, test-full]
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write        # push image to ghcr.io
      id-token: write        # cosign keyless via OIDC
      attestations: write    # SLSA provenance attestation
      security-events: write # upload Trivy SARIF to the Security tab
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.imgref.outputs.image_ref }}
      image_repo: ${{ steps.imgrepo.outputs.repo }}
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.version }}
          persist-credentials: false

      - name: Assert HEAD is the verified tag commit
        env:
          EXPECTED_SHA: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual, expected verified tag commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Build metadata (commit date, not wall clock — FR-L.68)
        id: meta
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repo
        id: imgrepo
        run: echo "repo=$(printf '%s' "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # DECISION: no `cache-from: type=gha` — a signed release image must not
      # be assembled from layers another workflow run could have written.
      # DECISION: push-by-digest, no `tags:`. Every gate below and in the
      # smoke jobs runs against this digest; nothing a deployment resolves
      # by tag (:latest, :vX.Y.Z) points at it until `release` says so.
      - name: Build & push by digest (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.imgrepo.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          no-cache: true
          labels: |
            org.opencontainers.image.title=SealKeeper
            org.opencontainers.image.version=${{ needs.verify-tag.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify-tag.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            VERSION=${{ needs.verify-tag.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}

      - name: Expose image reference
        id: imgref
        env:
          REPO: ${{ steps.imgrepo.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          echo "image_ref=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # The JS generation bundle is built from web/src inside the Dockerfile
      # (webbuild stage), so it is part of the digest cosign signs and SLSA
      # attests below. Refuse to sign an image whose /app/web lacks it.
      - name: Assert JS bundle is in the image (every platform)
        env:
          IMAGE_REF: ${{ steps.imgref.outputs.image_ref }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "$platform" "$IMAGE_REF" >/dev/null
            cid="$(docker create --platform "$platform" "$IMAGE_REF")"
            rm -rf bundle-check && mkdir bundle-check
            if ! docker cp "$cid:/app/web/sealkeeper-generation.umd.js" bundle-check/; then
              docker rm "$cid" >/dev/null
              echo "::error::$platform image has no /app/web/sealkeeper-generation.umd.js"
              exit 1
            fi
            docker rm "$cid" >/dev/null
            # The next platform pulls the same index digest; Docker refuses
            # to re-pull it over the local copy ("cannot overwrite digest").
            docker image rm "$IMAGE_REF" >/dev/null
            test -s bundle-check/sealkeeper-generation.umd.js
            grep -q 'SealKeeper' bundle-check/sealkeeper-generation.umd.js
            echo "$platform bundle sha256: $(sha256sum bundle-check/sealkeeper-generation.umd.js | cut -d' ' -f1)"
          done

      - name: Install Trivy (pinned + checksum)
        run: |
          set -euo pipefail
          curl -sSfL -o trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          echo "${TRIVY_SHA256}  trivy.deb" | sha256sum -c -
          sudo dpkg -i trivy.deb

      - name: Trivy scan (block on HIGH/CRITICAL)
        env:
          IMAGE_REF: ${{ steps.imgref.outputs.image_ref }}
        run: |
          set -euo pipefail
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format sarif \
            --output trivy.sarif \
            "$IMAGE_REF"

      - name: Upload Trivy SARIF
        # Only when the scan ran: an earlier failure must stay the one error.
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Install syft (pinned + checksum)
        run: |
          set -euo pipefail
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          sudo tar -xzf syft.tar.gz -C /usr/local/bin syft

      - name: Generate SBOM (CycloneDX 1.5)
        env:
          IMAGE_REF: ${{ steps.imgref.outputs.image_ref }}
        run: |
          set -euo pipefail
          syft "$IMAGE_REF" -o cyclonedx-json@1.5=sbom-image.cdx.json
          # Sanity check: spec version must be 1.5 (FR-L.66)
          jq -e '.specVersion == "1.5"' sbom-image.cdx.json >/dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Cosign keyless sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ steps.imgref.outputs.image_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"

      - name: Cosign attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ steps.imgref.outputs.image_ref }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate sbom-image.cdx.json \
            --type cyclonedx \
            "$IMAGE_REF"

      - name: SLSA provenance attestation (level 2)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.imgrepo.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-image
          path: sbom-image.cdx.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. SBOM for binaries + GPG-signed SHA256SUMS
  #    Protected environment: the maintainer GPG private key lives only there.
  #    DECISION: also waits for test-full so this job and build-image reach the
  #    environment approval gate together (one review covers both).
  # ---------------------------------------------------------------------------
  sign-binaries:
    name: SBOM + sign binaries
    runs-on: ubuntu-latest
    needs: [verify-tag, build-binaries, test-full]
    timeout-minutes: 8
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Install syft (pinned + checksum)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft

      - name: Generate SBOMs per binary
        run: |
          set -euo pipefail
          # Under dist/ so the artifact keeps one root: binaries and
          # SHA256SUMS at the top, SBOMs in sbom/ (upload-artifact strips
          # the paths' least common ancestor).
          mkdir -p dist/sbom
          for bin in dist/sealkeeper-*; do
            name="$(basename "$bin")"
            syft "$bin" -o cyclonedx-json@1.5="dist/sbom/${name}.cdx.json"
            jq -e '.specVersion == "1.5"' "dist/sbom/${name}.cdx.json" >/dev/null
          done

      - name: Compute SHA256SUMS
        working-directory: dist
        run: sha256sum sealkeeper-* > SHA256SUMS

      - name: Import maintainer GPG private key
        env:
          # Environment secret of `release` — never a repository secret.
          MAINTAINER_GPG_PRIVATE: ${{ secrets.MAINTAINER_GPG_PRIVATE }} # TODO: configure secret MAINTAINER_GPG_PRIVATE
        run: |
          set -euo pipefail
          printf '%s\n' "$MAINTAINER_GPG_PRIVATE" | gpg --batch --import
          # Cache passphrase via gpg-preset-passphrase if needed; here we expect a
          # passphrase-less subkey or GPG_PASSPHRASE injected at sign time.

      - name: GPG sign SHA256SUMS
        working-directory: dist
        env:
          GPG_TTY: ""
          GPG_PASSPHRASE: ${{ secrets.MAINTAINER_GPG_PASSPHRASE }} # TODO: configure secret MAINTAINER_GPG_PASSPHRASE
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

      - name: Remove GPG key material from the runner
        if: always()
        run: rm -rf "${HOME}/.gnupg"

      - name: Upload signed binaries bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-binaries
          path: |
            dist/sealkeeper-*
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
            dist/sbom/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 5. Package Helm chart
  # ---------------------------------------------------------------------------
  package-helm:
    name: Package Helm chart
    runs-on: ubuntu-latest
    needs: [verify-tag]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.version }}
          persist-credentials: false

      - name: Assert HEAD is the verified tag commit
        env:
          EXPECTED_SHA: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual, expected verified tag commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Lint chart
        # secret.masterSecret is required by the chart (SK-06); lint with a
        # throwaway value that is never stored.
        run: helm lint helm/sealkeeper --set secret.masterSecret="$(openssl rand -base64 32)"

      - name: Package chart
        env:
          VERSION: ${{ needs.verify-tag.outputs.version_nopv }}
        run: |
          set -euo pipefail
          mkdir -p chart-dist
          helm package helm/sealkeeper \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination chart-dist

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-chart
          path: chart-dist/sealkeeper-*.tgz
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 6. Assemble deployment bundle (tar.gz + zip)
  # ---------------------------------------------------------------------------
  assemble-bundle:
    name: Assemble deployment bundle
    runs-on: ubuntu-latest
    needs: [verify-tag, sign-binaries, package-helm]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      zipfile: ${{ steps.pack.outputs.zipfile }}
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.version }}
          persist-credentials: false

      - name: Assert HEAD is the verified tag commit
        env:
          EXPECTED_SHA: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual, expected verified tag commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Download signed-binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-binaries
          path: bundle/_in/binaries

      - name: Download Helm chart
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: helm-chart
          path: bundle/_in/helm

      - name: Stage bundle layout
        env:
          VERSION: ${{ needs.verify-tag.outputs.version_nopv }}
        run: |
          set -euo pipefail
          ROOT="bundle/sealkeeper-deploy-${VERSION}"
          mkdir -p "$ROOT/k8s" "$ROOT/examples/traefik" "$ROOT/examples/nginx" "$ROOT/examples/caddy" "$ROOT/helm" "$ROOT/binaries"

          # Core deployment files
          cp docker-compose.yml "$ROOT/docker-compose.yml"
          cp .env.example       "$ROOT/.env.example"
          cp examples/caddy/Caddyfile "$ROOT/examples/caddy/Caddyfile"
          cp examples/traefik/docker-compose.traefik.yml "$ROOT/examples/traefik/docker-compose.traefik.yml"
          cp examples/nginx/sealkeeper.conf "$ROOT/examples/nginx/sealkeeper.conf"
          cp -r k8s/. "$ROOT/k8s/"

          # Packaged Helm chart
          cp bundle/_in/helm/sealkeeper-*.tgz "$ROOT/helm/"

          # Binaries + signed checksums, side by side so that
          # `sha256sum -c SHA256SUMS` works from binaries/.
          cp bundle/_in/binaries/sealkeeper-*       "$ROOT/binaries/"
          cp bundle/_in/binaries/SHA256SUMS         "$ROOT/binaries/SHA256SUMS"
          cp bundle/_in/binaries/SHA256SUMS.asc     "$ROOT/binaries/SHA256SUMS.asc"
          chmod +x "$ROOT"/binaries/sealkeeper-*

          # LICENSE + Changelog excerpt
          cp LICENSE "$ROOT/LICENSE" 2>/dev/null || echo "TODO: LICENSE missing at root" > "$ROOT/LICENSE"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="${VERSION}" '
              BEGIN { inside=0 }
              /^## \[/ { if (inside) exit; if (index($0, ver)) inside=1 }
              inside { print }
            ' CHANGELOG.md > "$ROOT/CHANGELOG-excerpt.md"
          else
            printf "# Changelog excerpt for %s\n\nTODO: populate CHANGELOG.md\n" "${VERSION}" > "$ROOT/CHANGELOG-excerpt.md"
          fi

          # Deploy-only README
          if [ -f docs/README-DEPLOY.md ]; then
            cp docs/README-DEPLOY.md "$ROOT/README-DEPLOY.md"
          else
            cp QUICKSTART.md "$ROOT/README-DEPLOY.md"
          fi

      - name: Pack tarball + zip
        id: pack
        env:
          VERSION: ${{ needs.verify-tag.outputs.version_nopv }}
        run: |
          set -euo pipefail
          cd bundle
          tar -czf "sealkeeper-deploy-${VERSION}.tar.gz" "sealkeeper-deploy-${VERSION}"
          zip -rq    "sealkeeper-deploy-${VERSION}.zip"    "sealkeeper-deploy-${VERSION}"
          sha256sum "sealkeeper-deploy-${VERSION}".{tar.gz,zip} > "sealkeeper-deploy-${VERSION}.sha256"
          echo "tarball=bundle/sealkeeper-deploy-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "zipfile=bundle/sealkeeper-deploy-${VERSION}.zip"    >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-bundle
          path: |
            bundle/sealkeeper-deploy-*.tar.gz
            bundle/sealkeeper-deploy-*.zip
            bundle/sealkeeper-deploy-*.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 7. SMOKE TEST — full Compose bundle (CRITICAL gate before publish)
  # ---------------------------------------------------------------------------
  smoke-bundle:
    name: Smoke test Compose bundle
    runs-on: ubuntu-latest
    needs: [verify-tag, build-image, assemble-bundle]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-bundle
          path: bundle

      - name: Extract bundle
        env:
          VERSION: ${{ needs.verify-tag.outputs.version_nopv }}
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf "bundle/sealkeeper-deploy-${VERSION}.tar.gz" -C smoke
          echo "EXTRACT=smoke/sealkeeper-deploy-${VERSION}" >> "$GITHUB_ENV"

      # The bundle's Compose file refuses to render without SK_DOMAIN, and
      # only Caddy publishes host ports (80/443): the smoke test reaches
      # SealKeeper through Caddy at https://localhost, exactly like a real
      # deployment, with Caddy's internal CA for the `localhost` site.
      # SK_IMAGE is the gated digest: no release tag exists yet. ACME_EMAIL
      # is set as in .env.example: the Caddyfile's `email` takes one argument.
      - name: Generate fake master secret and write .env
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          SECRET=$(openssl rand -base64 32)
          cat > "$EXTRACT/.env" <<EOF
          SK_MODE=eval
          SK_DOMAIN=localhost
          ACME_EMAIL=smoke@example.test
          SK_BASE_URL=https://localhost
          SK_MASTER_SECRET=${SECRET}
          SK_HTTP_LISTEN=:8443
          SK_LOG_FORMAT=json
          SK_LOG_LEVEL=info
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          SK_IMAGE=${IMAGE_REF}
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker compose up -d
        working-directory: ${{ env.EXTRACT }}
        run: docker compose up -d

      # Caddy mints its local CA on first start; trust only that root.
      - name: Wait for /healthz through Caddy (120s timeout)
        working-directory: ${{ env.EXTRACT }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "${RUNNER_TEMP}/caddy-root.crt" >/dev/null 2>&1 \
              && curl -fsS --cacert "${RUNNER_TEMP}/caddy-root.crt" https://localhost/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::healthz never returned 200 through Caddy within 120s"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Check public root (GET /)
        run: curl -fsS --cacert "${RUNNER_TEMP}/caddy-root.crt" -o /dev/null -w "%{http_code}\n" https://localhost/ | grep -q '^200$'

      - name: Check policy endpoint (GET /api/v1/policy)
        run: |
          set -euo pipefail
          body=$(curl -fsS --cacert "${RUNNER_TEMP}/caddy-root.crt" https://localhost/api/v1/policy)
          echo "$body" | jq -e '.' >/dev/null

      - name: Verify captured mail in eval mode (POST request + GET /__captured_mail)
        run: |
          set -euo pipefail
          # Submit a benign request that should generate a captured mail in eval mode.
          # Endpoint shape per FR-G + module C; tolerate JSON or form bodies.
          curl -fsS --cacert "${RUNNER_TEMP}/caddy-root.crt" -X POST -H "Content-Type: application/json" \
            -d '{"email":"smoke@example.test","domain":"example.test"}' \
            https://localhost/api/v1/request || true
          # Allow a brief window for the request pipeline to capture the mail.
          sleep 3
          mails=$(curl -fsS --cacert "${RUNNER_TEMP}/caddy-root.crt" https://localhost/__captured_mail)
          echo "$mails" | jq -e '.items | length >= 1' >/dev/null || {
            echo "::error::No mail captured in eval mode"
            docker compose -f "${EXTRACT}/docker-compose.yml" logs --tail=200
            exit 1
          }

      - name: Tear down
        if: always()
        working-directory: ${{ env.EXTRACT }}
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 8. SMOKE TEST — image alone via docker run (D-L.21)
  # ---------------------------------------------------------------------------
  smoke-image:
    name: Smoke test image (docker run)
    runs-on: ubuntu-latest
    needs: [verify-tag, build-image]
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull by the signed digest, not the mutable tag. The eval SQLite file
      # lives in /data, which the bare image lacks (and UID 65532 cannot
      # create): give it a tmpfs owned by that UID.
      - name: Pull and run (eval mode)
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker run -d --name sk-smoke -p 8443:8443 \
            --tmpfs /data:rw,uid=65532,gid=65532,mode=0700 \
            -e SK_MODE=eval \
            "$IMAGE_REF"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8443/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS http://localhost:8443/healthz >/dev/null; then
            docker logs sk-smoke || true
            exit 1
          fi
          # The reveal page cannot generate anything without the JS bundle.
          if ! curl -fsS -o bundle.js http://localhost:8443/static/sealkeeper-generation.umd.js; then
            echo "::error::image does not serve the JS generation bundle"
            exit 1
          fi
          test -s bundle.js
          grep -q 'SealKeeper' bundle.js
          docker rm -f sk-smoke >/dev/null

  # ---------------------------------------------------------------------------
  # 9. Publish GitHub Release (gated on all upstream jobs including smokes)
  #    Protected environment: tags the gated image digest, creates the
  #    Release and pushes the Helm chart.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - test-full
      - build-binaries
      - build-image
      - sign-binaries
      - package-helm
      - assemble-bundle
      - smoke-bundle
      - smoke-image
    timeout-minutes: 8
    environment: release
    permissions:
      contents: write # create GitHub Release, upload assets
      packages: write # add the release tags to the gated image digest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every gate passed against IMAGE_REF (repo@digest), which cosign
      # signed and SLSA attested. With a single source index, imagetools
      # create copies the manifest unchanged, so the tags resolve to that
      # same digest — re-checked below rather than assumed.
      - name: Tag the gated image digest
        env:
          IMAGE_REPO_LC: ${{ needs.build-image.outputs.image_repo }}
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.image_digest }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          VERSION_NOPV: ${{ needs.verify-tag.outputs.version_nopv }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          tags=("${IMAGE_REPO_LC}:${VERSION}" "${IMAGE_REPO_LC}:${VERSION_NOPV}")
          if [ "$PRERELEASE" = "false" ]; then
            tags+=("${IMAGE_REPO_LC}:latest")
          else
            echo "Prerelease ${VERSION}: :latest is left untouched"
          fi
          args=()
          for t in "${tags[@]}"; do args+=(--tag "$t"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE_REF"
          for t in "${tags[@]}"; do
            got="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$t")"
            if [ "$got" != "$IMAGE_DIGEST" ]; then
              echo "::error::$t resolves to $got, expected the gated digest $IMAGE_DIGEST"
              exit 1
            fi
            echo "$t -> $got"
          done

      - name: Download signed binaries + SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-binaries
          path: release-assets/binaries

      - name: Download image SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-image
          path: release-assets/sbom

      - name: Download Helm chart
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: helm-chart
          path: release-assets/helm

      - name: Download deployment bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-bundle
          path: release-assets/bundle

      - name: Compose release notes
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          repo=$(printf '%s' "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          cat > release-notes.md <<EOF
          # SealKeeper ${VERSION}

          ## Try it in 5 seconds (eval mode)

          \`\`\`
          docker run --rm -p 8443:8443 -e SK_MODE=eval ${repo}:${VERSION}
          \`\`\`

          Opens on http://localhost:8443/ with an auto-generated master secret,
          SQLite storage and a bootstrap admin password printed to the logs
          (FR-H.11..19).

          ## Production deployments

          1. **Docker Compose** — download \`sealkeeper-deploy-${VERSION#v}.tar.gz\`
             below, fill in \`.env\`, then \`docker compose up -d\`.
          2. **Kubernetes / Helm** — \`helm install sealkeeper helm/sealkeeper-${VERSION#v}.tgz --set secret.masterSecret="\$(openssl rand -base64 32)"\`
             (or point \`secret.existingSecret\` at a Secret managed out of band).

          ## What's changed

          Security fixes, upgrade notes and acknowledgements:
          [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md).

          ## Artifacts

          - Binaries: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64
          - OCI image: \`${repo}:${VERSION}\` (digest \`${IMAGE_DIGEST}\`), signed with cosign keyless (Rekor)
          - SBOM CycloneDX 1.5 attached for binaries and image
          - SLSA level 2 provenance attestation (verifiable via \`gh attestation verify\`)
          - Helm chart \`sealkeeper-${VERSION#v}.tgz\`
          - Deployment bundle (\`sealkeeper-deploy-${VERSION#v}.tar.gz\` / \`.zip\`)

          ## Verifying

          See \`docs/security/verification.md\` for instructions on verifying GPG
          signatures (SHA256SUMS), cosign image signatures and SLSA provenance.
          Release checksums and binary SBOMs are attached below; in the
          deployment bundle they sit next to the binaries in \`binaries/\`.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.verify-tag.outputs.version }}
          name: ${{ needs.verify-tag.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.verify-tag.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/binaries/sealkeeper-*
            release-assets/binaries/SHA256SUMS
            release-assets/binaries/SHA256SUMS.asc
            release-assets/binaries/sbom/sealkeeper-*.cdx.json
            release-assets/sbom/sbom-image.cdx.json
            release-assets/helm/sealkeeper-*.tgz
            release-assets/bundle/sealkeeper-deploy-*.tar.gz
            release-assets/bundle/sealkeeper-deploy-*.zip
            release-assets/bundle/sealkeeper-deploy-*.sha256

      - name: Push Helm chart to repo
        env:
          # DECISION: PRD H §6.1 / D-H.14 mentions sealkeeper.eu/charts; the
          # actual push target depends on the Pages/S3/OCI choice that is not
          # yet pinned. We leave the secret-based push out and add a TODO so the
          # release does not silently no-op.
          HELM_REPO_URL: ${{ secrets.HELM_REPO_URL }}      # TODO: configure HELM_REPO_URL (e.g. oci://ghcr.io/<owner>/charts)
          HELM_REPO_USER: ${{ secrets.HELM_REPO_USER }}    # TODO: configure HELM_REPO_USER if HTTP basic auth
          HELM_REPO_TOKEN: ${{ secrets.HELM_REPO_TOKEN }}  # TODO: configure HELM_REPO_TOKEN
        run: |
          set -euo pipefail
          if [ -z "${HELM_REPO_URL:-}" ]; then
            echo "::warning::HELM_REPO_URL not set — Helm chart push is skipped. See TODO."
            exit 0
          fi
          # OCI push path (recommended): helm push <chart>.tgz <oci-url>
          if [[ "$HELM_REPO_URL" == oci://* ]]; then
            echo "${HELM_REPO_TOKEN}" | helm registry login \
              "$(echo "$HELM_REPO_URL" | sed 's|^oci://||; s|/.*$||')" \
              --username "${HELM_REPO_USER:-${GITHUB_ACTOR}}" \
              --password-stdin
            for tgz in release-assets/helm/sealkeeper-*.tgz; do
              helm push "$tgz" "$HELM_REPO_URL"
            done
          else
            # HTTP repo: typical chartmuseum, requires curl with auth
            for tgz in release-assets/helm/sealkeeper-*.tgz; do
              curl -fsS -u "${HELM_REPO_USER}:${HELM_REPO_TOKEN}" \
                --data-binary "@${tgz}" \
                "$HELM_REPO_URL"
            done
          fi
