# =============================================================================
# Nginx reverse-proxy configuration for SealKeeper
# =============================================================================
# PRD: FR-H.45 — Nginx reverse-proxy reference. Drop this file under
# /etc/nginx/conf.d/sealkeeper.conf (or include it in your existing server
# block setup) and reload nginx.
#
# TLS certificate management is intentionally NOT included here — Nginx is
# usually deployed with an external certbot/acme.sh flow or a managed cert
# from your CDN. Adjust the paths in the `ssl_*` directives below.
# =============================================================================

# Cache policy for /static/ (SK-36): keep the upstream Cache-Control when
# SealKeeper sends one, otherwise force revalidation. http-context directive —
# this file is meant to be included from the http {} block (conf.d/).
map $upstream_http_cache_control $sealkeeper_static_cache_control {
	""      "no-cache";
	default $upstream_http_cache_control;
}

# Token redaction for the access log. /reveal/<token> carries a live,
# single-use reveal token — a bearer credential: anyone reading the access
# log (or a SIEM fed by it) could open the link before its owner. Query
# strings are redacted wholesale (no SealKeeper route needs them logged,
# and a stray ?token= must never reach the log). The log format below uses
# this variable INSTEAD of $request / $request_uri / $args / $http_referer —
# never add those back.
map $request_uri $sealkeeper_log_uri {
	"~*^/+reveal/"              "/reveal/REDACTED";
	"~^(?<sk_log_path>[^?]*)\?" "${sk_log_path}?REDACTED";
	default                     $request_uri;
}

log_format sealkeeper_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$sealkeeper_log_uri","protocol":"$server_protocol","status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_status":"$upstream_status","user_agent":"$http_user_agent","request_id":"$request_id"}';

# Upstream — SealKeeper listens on plain HTTP, TLS is terminated by Nginx.
upstream sealkeeper_upstream {
	zone sealkeeper 64k;
	server 127.0.0.1:8443 max_fails=3 fail_timeout=10s;
	keepalive 16;
}

# Redirect plain HTTP to HTTPS (also serves the ACME http-01 challenge).
server {
	listen      80;
	listen      [::]:80;
	server_name sealkeeper.example.com;

	location /.well-known/acme-challenge/ {
		root /var/www/acme;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen      443 ssl;
	listen      [::]:443 ssl;
	http2       on;
	server_name sealkeeper.example.com;

	# ---------------------------------------------------------------------
	# TLS — replace paths with your certificate management output.
	# ---------------------------------------------------------------------
	ssl_certificate     /etc/letsencrypt/live/sealkeeper.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/sealkeeper.example.com/privkey.pem;

	# Modern profile (Mozilla Intermediate). FR-H.76: TLS 1.2 minimum.
	ssl_protocols              TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers  off;
	ssl_session_cache          shared:SSL:10m;
	ssl_session_timeout        1h;
	ssl_session_tickets        off;
	ssl_stapling               on;
	ssl_stapling_verify        on;

	# ---------------------------------------------------------------------
	# Security headers
	# ---------------------------------------------------------------------
	# SealKeeper sets Content-Security-Policy, Strict-Transport-Security,
	# X-Frame-Options, Referrer-Policy and X-Content-Type-Options itself and
	# nginx passes upstream headers through unchanged — do NOT add them here
	# as well (duplicate X-Frame-Options / CSP values are treated as invalid
	# or intersected by browsers).
	#
	# Pitfall: nginx inherits server-level `add_header` directives into a
	# location ONLY if that location declares no `add_header` of its own.
	# Every location below that uses add_header repeats this line.
	add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

	# Hide nginx version (also: server_tokens off in nginx.conf)
	more_clear_headers Server;

	# ---------------------------------------------------------------------
	# Forwarding to SealKeeper
	# ---------------------------------------------------------------------
	# IMPORTANT (SK-35): SealKeeper trusts X-Forwarded-For only when the TCP
	# peer is in SK_TRUSTED_PROXY_CIDRS (FR-H.42 / D-H.22). Set it to the
	# address nginx connects FROM, and nothing wider:
	#   - sealkeeper binary on the same host:       SK_TRUSTED_PROXY_CIDRS=127.0.0.1/32
	#   - sealkeeper in Docker, port published on
	#     127.0.0.1:8443:                            the Docker bridge gateway
	#                                                 (e.g. 172.17.0.1/32)
	#   - nginx on another machine:                  that machine's IP /32
	# If the value does not match, every user appears as nginx's address and
	# all of them share ONE per-IP rate-limit bucket.
	#
	# nginx is the edge here, so X-Forwarded-For is overwritten with the real
	# peer instead of appending to whatever the client sent. Behind a CDN /
	# load balancer, switch to $proxy_add_x_forwarded_for and configure
	# set_real_ip_from for the CDN ranges.
	proxy_http_version 1.1;
	proxy_set_header   Host              $host;
	proxy_set_header   X-Real-IP         $remote_addr;
	proxy_set_header   X-Forwarded-For   $remote_addr;
	proxy_set_header   X-Forwarded-Proto https;
	proxy_set_header   X-Forwarded-Host  $host;
	proxy_set_header   X-Forwarded-Port  $server_port;
	proxy_set_header   Connection        "";

	proxy_read_timeout 60s;
	proxy_send_timeout 60s;
	proxy_buffering    off;

	# Static assets (SK-36). The generation bundle is served from the fixed,
	# un-hashed URL /static/sealkeeper-generation.umd.js without SRI, and it
	# is the code that generates every password — it must NEVER be cached as
	# immutable. `no-cache` keeps a browser copy but forces revalidation on
	# each use, so a generator fix reaches every client on the next load.
	# Responses that already carry a Cache-Control (e.g. the branding logo's
	# short max-age) keep it — see the map at the top of this file.
	location ^~ /static/ {
		proxy_pass        http://sealkeeper_upstream;
		proxy_hide_header Cache-Control;
		add_header        Cache-Control      $sealkeeper_static_cache_control always;
		# add_header above disables inheritance — repeat the server-level one.
		add_header        Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
	}

	# Reveal links and the token-consume endpoint. nginx's error log cannot
	# be redacted: an upstream failure line embeds the full request line
	# (request: "GET /reveal/<token> ..."). Raise the threshold to `crit`
	# here so those lines are never written; SealKeeper's own logs and
	# /healthz still surface backend failures. (Error lines on other paths
	# also print the Referer; the reveal page is served with
	# Referrer-Policy: no-referrer, so browsers never send its URL onward.)
	location ^~ /reveal/ {
		proxy_pass http://sealkeeper_upstream;
		error_log  /var/log/nginx/sealkeeper-error.log crit;
	}

	location = /api/v1/policy {
		proxy_pass http://sealkeeper_upstream;
		error_log  /var/log/nginx/sealkeeper-error.log crit;
	}

	location / {
		proxy_pass http://sealkeeper_upstream;
	}

	# Compression — only safe MIME types
	gzip               on;
	gzip_vary          on;
	gzip_proxied       any;
	gzip_min_length    1024;
	gzip_types         text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml application/wasm;

	# Access log JSON, token-redacted — see `sealkeeper_json` at the top of
	# this file. Do not switch to `combined` or a format logging $request:
	# both write reveal tokens in clear.
	access_log /var/log/nginx/sealkeeper-access.log sealkeeper_json;
	error_log  /var/log/nginx/sealkeeper-error.log warn;
}
