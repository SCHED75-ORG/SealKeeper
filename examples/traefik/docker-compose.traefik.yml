# =============================================================================
# SealKeeper — Traefik reverse-proxy variant
# =============================================================================
# PRD: FR-H.44 — Traefik example variant of the reference Compose stack.
#
# Use this file instead of the root `docker-compose.yml` when you prefer
# Traefik over Caddy:
#
#   cd examples/traefik
#   ln -sf ../../.env .env
#   docker compose -f docker-compose.traefik.yml up -d
#
# The `.env` schema is identical to the root deployment — SK_DOMAIN,
# ACME_EMAIL and the SK_* / POSTGRES_* variables are reused as-is.
# =============================================================================

x-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.3  # >= v3.3: per-router observability (token-free access log)
    container_name: sealkeeper-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sealkeeper-frontend"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=le"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL required}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.level=INFO"
      - "--log.format=json"
    ports:
      - "${SK_HTTP_PORT:-80}:80"
      - "${SK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      frontend:
        ipv4_address: 172.31.251.10 # == SK_TRUSTED_PROXY_CIDRS default
      backend: {}
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  postgres:
    image: postgres:16-alpine
    container_name: sealkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sealkeeper}
      POSTGRES_USER: ${POSTGRES_USER:-sealkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sealkeeper} -d ${POSTGRES_DB:-sealkeeper}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *json-logging
    security_opt:
      - no-new-privileges:true

  sealkeeper:
    image: ${SK_IMAGE:-ghcr.io/sched75-org/sealkeeper:latest}
    container_name: sealkeeper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SK_MODE: ${SK_MODE:-production}
      SK_BASE_URL: ${SK_BASE_URL:?SK_BASE_URL must be set}
      SK_HTTP_LISTEN: ":8443"
      SK_DATABASE_URL: postgres://${POSTGRES_USER:-sealkeeper}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sealkeeper}?sslmode=disable
      SK_MASTER_SECRET: ${SK_MASTER_SECRET:?SK_MASTER_SECRET must be set}
      SK_LOG_FORMAT: ${SK_LOG_FORMAT:-json}
      SK_LOG_LEVEL: ${SK_LOG_LEVEL:-info}
      # SK-35 — trust X-Forwarded-For only from Traefik's pinned address on
      # sealkeeper-frontend (the network Traefik uses to reach this service,
      # see traefik.docker.network below).
      SK_TRUSTED_PROXY_CIDRS: ${SK_TRUSTED_PROXY_CIDRS:-172.31.251.10/32}
    volumes:
      - sealkeeper-data:/data
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    logging: *json-logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sealkeeper-frontend"
      - "traefik.http.routers.sealkeeper.rule=Host(`${SK_DOMAIN:?SK_DOMAIN required}`)"
      - "traefik.http.routers.sealkeeper.entrypoints=websecure"
      - "traefik.http.routers.sealkeeper.tls=true"
      - "traefik.http.routers.sealkeeper.tls.certresolver=le"
      - "traefik.http.services.sealkeeper.loadbalancer.server.port=8443"
      # Security headers — SealKeeper itself sets CSP, HSTS, X-Frame-Options,
      # Referrer-Policy and X-Content-Type-Options; Traefik passes them
      # through untouched. Only Permissions-Policy is added here.
      - "traefik.http.middlewares.sealkeeper-headers.headers.permissionsPolicy=accelerometer=(), camera=(),
        geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      - "traefik.http.routers.sealkeeper.middlewares=sealkeeper-headers@docker"
      # /static/* (SK-36): the generation bundle has a fixed, un-hashed URL and
      # no SRI, so browsers must revalidate it on every use — a generator fix
      # has to reach clients immediately. /static/branding/ keeps the
      # server's own short max-age.
      - "traefik.http.routers.sealkeeper-static.rule=Host(`${SK_DOMAIN:?SK_DOMAIN required}`) && PathPrefix(`/static/`) && !PathPrefix(`/static/branding/`)"
      - "traefik.http.routers.sealkeeper-static.entrypoints=websecure"
      - "traefik.http.routers.sealkeeper-static.tls=true"
      - "traefik.http.routers.sealkeeper-static.tls.certresolver=le"
      - "traefik.http.routers.sealkeeper-static.service=sealkeeper"
      - "traefik.http.middlewares.sealkeeper-static-cache.headers.customResponseHeaders.Cache-Control=no-cache"
      - "traefik.http.routers.sealkeeper-static.middlewares=sealkeeper-headers@docker,sealkeeper-static-cache@docker"
      # Reveal links (tokenlogs): /reveal/<token> carries a live, single-use
      # reveal token — a bearer credential. Traefik's access log writes the
      # full RequestPath (query string included) and cannot redact part of
      # it, so this router — reveal pages and the token-consume endpoint —
      # is excluded from the access log altogether. SealKeeper still audits
      # every issue/consume itself (token pseudonymised). Requires Traefik
      # >= v3.3 (router `observability` options; v3.2 rejects them).
      - "traefik.http.routers.sealkeeper-reveal.rule=Host(`${SK_DOMAIN:?SK_DOMAIN required}`) && (PathPrefix(`/reveal/`) || Path(`/api/v1/policy`))"
      - "traefik.http.routers.sealkeeper-reveal.entrypoints=websecure"
      - "traefik.http.routers.sealkeeper-reveal.tls=true"
      - "traefik.http.routers.sealkeeper-reveal.tls.certresolver=le"
      - "traefik.http.routers.sealkeeper-reveal.service=sealkeeper"
      - "traefik.http.routers.sealkeeper-reveal.middlewares=sealkeeper-headers@docker"
      - "traefik.http.routers.sealkeeper-reveal.observability.accessLogs=false"

volumes:
  sealkeeper-data:
  postgres-data:
  traefik-acme:

networks:
  backend:
    name: sealkeeper-backend
    driver: bridge
    internal: true
  # Subnet pinned so Traefik's address is stable (SK-35). If it collides with
  # another host network, change the subnet, Traefik's ipv4_address and
  # SK_TRUSTED_PROXY_CIDRS together.
  frontend:
    name: sealkeeper-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.251.0/24
