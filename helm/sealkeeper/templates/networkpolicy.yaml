{{- if .Values.networkPolicy.enabled -}}
{{- /*
  SK-35: ingress is restricted to the ingress controller namespace (and the
  metrics scraper when configured) so no other pod can reach :8443 and forge
  X-Forwarded-For. Egress filtering is opt-in (networkPolicy.egress.enabled)
  because it needs the database / SMTP / SIEM destinations to be listed.
*/ -}}
{{- $egress := .Values.networkPolicy.egress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sealkeeper.fullname" . }}
  labels:
    {{- include "sealkeeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sealkeeper.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespaceLabel }}
      ports:
        - protocol: TCP
          port: 8443
    {{- if .Values.networkPolicy.metricsNamespaceLabel }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespaceLabel }}
      ports:
        - protocol: TCP
          port: 8443
    {{- end }}
  {{- if $egress }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.database.cidrs }}
    - to:
        {{- range .Values.networkPolicy.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.database.port }}
    {{- end }}
    {{- if .Values.networkPolicy.smtp.enabled }}
    - to:
        {{- range .Values.networkPolicy.smtp.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.smtp.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.siem.enabled }}
    - to:
        {{- range .Values.networkPolicy.siem.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.siem.ports }}
        - protocol: {{ .protocol }}
          port: {{ .number }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
