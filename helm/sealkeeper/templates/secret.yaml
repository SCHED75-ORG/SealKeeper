{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
{{- /*
  SK-06: never render a usable placeholder master key. Outside eval mode the
  value is required, and whatever is supplied must decode to exactly 32
  bytes. Use `secret.existingSecret` to manage the Secret out of band.
*/ -}}
{{- $ms := .Values.secret.masterSecret | default "" -}}
{{- if and (not $ms) (ne .Values.config.mode "eval") -}}
{{- fail "secret.masterSecret is required outside eval mode: pass --set secret.masterSecret=\"$(openssl rand -base64 32)\" or point secret.existingSecret at a Secret managed out of band" -}}
{{- end -}}
{{- if $ms -}}
{{- if contains "REPLACE_ME" $ms -}}
{{- fail "secret.masterSecret still holds the documentation placeholder; generate one with `openssl rand -base64 32`" -}}
{{- end -}}
{{- if ne (len (b64dec $ms)) 32 -}}
{{- fail "secret.masterSecret must be base64 of exactly 32 random bytes (`openssl rand -base64 32`)" -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sealkeeper.fullname" . }}
  labels:
    {{- include "sealkeeper.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ms }}
  SK_MASTER_SECRET: {{ $ms | quote }}
  {{- end }}
  {{- if .Values.secret.databaseUrl }}
  SK_DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secret.metricsToken }}
  SK_METRICS_TOKEN: {{ .Values.secret.metricsToken | quote }}
  {{- end }}
{{- end }}
