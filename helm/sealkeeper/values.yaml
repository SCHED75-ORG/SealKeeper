# Default values for SealKeeper.
# Override on the CLI: `helm install sealkeeper ./sealkeeper -f my-values.yaml`
# PRD: module H §6.1.

image:
  repository: ghcr.io/sched75-org/sealkeeper
  tag: ""               # falls back to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []       # [{ name: regcred }]

# Replica count. Recommended ≥ 2 for HA (FR-H.36).
replicaCount: 2

# Names — keep empty to use the chart-generated defaults.
nameOverride: ""
fullnameOverride: ""

# Application configuration → ConfigMap (non-secret) and Secret.
config:
  # SK_MODE: "production" or "eval" (FR-H.13)
  mode: production
  # SK_BASE_URL — public URL used for cookie domain + absolute links.
  baseUrl: https://sealkeeper.example.com
  httpListen: ":8443"
  logFormat: json
  logLevel: info
  # FR-H.42 / D-H.22 / SK-35 — comma-separated CIDR(s) allowed to set
  # X-Forwarded-For. Empty = trust nobody: no spoofing, but behind an ingress
  # every client then shares the controller pod's IP (one rate-limit bucket).
  # Set it to the ingress controller's pod CIDR ONLY, e.g. "10.244.3.0/24" —
  # never a blanket "10.0.0.0/8", which also trusts every other pod and the
  # SNATed node IPs. Pair with `externalTrafficPolicy: Local` (or the PROXY
  # protocol) on the ingress controller's Service so it sees real client IPs.
  trustedProxyCIDRs: ""
  maxLibrarySizeMB: 10
  adminSessionTTLSeconds: 28800
  adminSessionIdleSeconds: 1800
  swaggerUiEnabled: false
  demoMode: false

# Secrets — see secret.yaml. In production prefer ExternalSecrets / Sealed
# Secrets and set `secret.create: false` + `secret.existingSecret: <name>`.
secret:
  create: true
  existingSecret: ""
  # REQUIRED outside eval mode when secret.create is true (SK-06): base64 of
  # exactly 32 random bytes — `openssl rand -base64 32`. The chart refuses to
  # render with an empty, placeholder or wrongly sized value. Prefer
  # `--set secret.masterSecret=...` from a vault over committing it to a
  # values file, or use `existingSecret`.
  masterSecret: ""
  # Full DSN. Either supply a value here OR use a pre-existing secret managed
  # out of band.
  databaseUrl: ""
  # Optional bearer token for /metrics. Empty disables auth.
  metricsToken: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

# Pod-level security context (FR-H.33, 68-71).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8443
  annotations: {}

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: sealkeeper.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sealkeeper-tls
      hosts:
        - sealkeeper.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
  # Reveal links (/reveal/<token>) and the token-consume endpoint get a
  # second Ingress with the access log OFF: the URL carries a live,
  # single-use token, and the controller's default log format writes the
  # full request line — anyone reading those logs (or the SIEM they feed)
  # could open the link first. The default annotation is for ingress-nginx;
  # set the equivalent for another controller. Keep it enabled.
  #
  # Error log: ingress-nginx cannot redact it either. On an upstream failure
  # (SealKeeper down — the token is then never consumed and stays live) it
  # writes `request: "GET /reveal/<token> ..."` at `error` level. No plain
  # annotation lowers the error-log level per path; with snippet
  # annotations allowed on the controller (allow-snippet-annotations=true,
  # annotations-risk-level=Critical), uncomment the snippet below. It is not
  # on by default because a controller that refuses snippets rejects the
  # whole Ingress. Otherwise set the controller-wide ConfigMap key
  # `error-log-level: crit`, or keep the controller's stderr out of any
  # shared log pipeline.
  revealPaths:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/enable-access-log: "false"
      # nginx.ingress.kubernetes.io/configuration-snippet: |
      #   error_log /var/log/nginx/error.log crit;
  # Cert-manager — set issuer to enable.
  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Probes (FR-H.35).
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    initialDelaySeconds: 2
    periodSeconds: 2
    failureThreshold: 30

persistence:
  enabled: false
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  annotations: {}

# Rolling update strategy — pair with PDB minAvailable: 1 below for zero
# downtime upgrades (FR-H.64).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy (FR-H.32, SK-35) — enabled by default. Ingress to :8443 is
# allowed only from the ingress controller namespace, so no other pod can
# reach SealKeeper directly and forge X-Forwarded-For. On clusters whose CNI
# does not enforce NetworkPolicy the object is inert.
networkPolicy:
  enabled: true
  # `kubernetes.io/metadata.name` of the namespace running the ingress
  # controller. Change it if yours is not `ingress-nginx`, or traffic will be
  # dropped.
  ingressNamespaceLabel: ingress-nginx
  # Namespace of the Prometheus scraper when /metrics is scraped in-cluster
  # (e.g. "monitoring"). Empty = no extra ingress rule.
  metricsNamespaceLabel: ""
  # Egress filtering is opt-in: when enabled, only DNS plus the destinations
  # listed below are reachable. List the database first or the pod cannot
  # start.
  egress:
    enabled: false
  database:
    cidrs: []          # e.g. ["10.20.0.15/32"]
    port: 5432
  # Egress CIDRs are conservative-ish; narrow in prod.
  smtp:
    enabled: false
    cidrs: []
    ports: [587]
  siem:
    enabled: false
    cidrs: []
    ports:
      - { protocol: TCP, number: 514 }

# Prometheus ServiceMonitor — created only when prometheus-operator is
# installed and `serviceMonitor.enabled: true`.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  bearerTokenSecret: ""   # set when /metrics requires SK_METRICS_TOKEN

# Topology spread / affinity / tolerations / nodeSelector
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: sealkeeper

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables and volumes — escape hatches for unforeseen needs.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
