# =============================================================================
# SealKeeper — non-sensitive runtime configuration
# =============================================================================
# Only NON-sensitive variables live here. SK_MASTER_SECRET and Postgres
# credentials are kept in a Secret (see secret.example.yaml).
# PRD: FR-H.31 — env vars sourced from ConfigMap + Secret.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: sealkeeper
  namespace: sealkeeper
  labels:
    app.kubernetes.io/name: sealkeeper
data:
  SK_MODE: production
  SK_HTTP_LISTEN: ":8443"
  SK_BASE_URL: https://sealkeeper.example.com
  SK_LOG_FORMAT: json
  SK_LOG_LEVEL: info
  # FR-H.42 / D-H.22 / SK-35 — CIDR(s) allowed to set X-Forwarded-For.
  # Empty = trust nobody (no spoofing, but every client then shares the
  # ingress controller's IP for rate limiting). Set this to the ingress
  # controller's pod CIDR ONLY, never all of RFC 1918. See README.md
  # § "Client IP and trusted proxies".
  SK_TRUSTED_PROXY_CIDRS: ""
  SK_MAX_LIBRARY_SIZE_MB: "10"
  SK_ADMIN_SESSION_TTL_SECONDS: "28800"
  SK_ADMIN_SESSION_IDLE_SECONDS: "1800"
  SK_SWAGGER_UI_ENABLED: "false"
  SK_DEMO_MODE: "false"
