# =============================================================================
# SealKeeper — Ingress (TLS via cert-manager)
# =============================================================================
# DECISION: target ingress-nginx by default; the annotations on other
# controllers are similar but vary. Cert-manager is recommended; the
# annotation `cert-manager.io/cluster-issuer` is left commented so the file
# applies cleanly without cert-manager installed.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sealkeeper
  namespace: sealkeeper
  labels:
    app.kubernetes.io/name: sealkeeper
  annotations:
    # TLS via cert-manager — uncomment when the cluster issuer is provisioned.
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: no-referrer";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sealkeeper.example.com
      secretName: sealkeeper-tls
  rules:
    - host: sealkeeper.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sealkeeper
                port:
                  number: 8443
---
# Reveal links carry a live, single-use token in the URL (/reveal/<token>):
# a bearer credential that ingress-nginx's default access log (full request
# line) — and any SIEM fed by it — would hold in clear. These paths get
# their own Ingress so the access log is OFF for them alone. Keep the
# annotations of the main Ingress above in sync.
#
# The controller's error log cannot be redacted either: on an upstream
# failure (SealKeeper down — the token is then never consumed and stays
# live) nginx writes `request: "GET /reveal/<token> ..."`. The
# `error_log ... crit` line in the snippet below silences those lines for
# these two paths only; SealKeeper's /readyz and the controller's other
# locations still surface backend failures. Like the main Ingress, this
# needs snippet annotations allowed on the controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sealkeeper-reveal
  namespace: sealkeeper
  labels:
    app.kubernetes.io/name: sealkeeper
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      error_log /var/log/nginx/error.log crit;
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: no-referrer";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sealkeeper.example.com
      secretName: sealkeeper-tls
  rules:
    - host: sealkeeper.example.com
      http:
        paths:
          - path: /reveal/
            pathType: Prefix
            backend:
              service:
                name: sealkeeper
                port:
                  number: 8443
          - path: /api/v1/policy
            pathType: Exact
            backend:
              service:
                name: sealkeeper
                port:
                  number: 8443
