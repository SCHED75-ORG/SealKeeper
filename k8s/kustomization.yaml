# =============================================================================
# Kustomization — apply with `kubectl apply -k .`
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sealkeeper

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  # DECISION (SK-06): no Secret is part of this kustomization. The
  # `sealkeeper` Secret (SK_MASTER_SECRET, SK_DATABASE_URL, SK_METRICS_TOKEN)
  # must exist BEFORE `kubectl apply -k .` and is created out of band —
  # External Secrets / Sealed Secrets, or once by hand:
  #
  #   kubectl apply -f namespace.yaml
  #   kubectl -n sealkeeper create secret generic sealkeeper \
  #     --from-literal=SK_MASTER_SECRET="$(openssl rand -base64 32)" \
  #     --from-literal=SK_DATABASE_URL='postgres://…?sslmode=verify-full'
  #
  # secret.example.yaml documents the expected keys only; it is never applied
  # from here so a placeholder master key can never reach a cluster.
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - poddisruptionbudget.yaml

commonLabels:
  app.kubernetes.io/name: sealkeeper
  app.kubernetes.io/part-of: sealkeeper

# Bump this when rolling out a new release. Kustomize will inject
# `image: ghcr.io/sched75-org/sealkeeper:vX.Y.Z` into the deployment.
images:
  - name: ghcr.io/sched75-org/sealkeeper
    newTag: latest
