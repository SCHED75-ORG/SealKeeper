# =============================================================================
# SealKeeper — Secret template (NEVER COMMIT REAL VALUES)
# =============================================================================
# This file is intentionally an EXAMPLE. Copy to secret.yaml and replace the
# placeholders, OR use External Secrets / Sealed Secrets to manage it out of
# band — that's the recommended path in production (FR-H.31).
#
# Generate the master secret with:
#     openssl rand -base64 32
#
# Stage `kubectl apply -f secret.yaml`-style applies through a private
# repository or vault integration — DO NOT push secret.yaml to git.
#
# This file is deliberately NOT listed in kustomization.yaml (SK-06): the
# values below are empty so that applying it unedited makes SealKeeper refuse
# to start instead of running with a publicly known master key. See
# README.md § Apply for the `kubectl create secret` one-liner.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sealkeeper
  namespace: sealkeeper
  labels:
    app.kubernetes.io/name: sealkeeper
type: Opaque
stringData:
  # REQUIRED — output of `openssl rand -base64 32` (exactly 32 bytes once
  # decoded). Unique per deployment; never reuse a value seen in a repo.
  SK_MASTER_SECRET: ""
  # REQUIRED — e.g. postgres://sealkeeper:<password>@postgres.sealkeeper.svc.cluster.local:5432/sealkeeper?sslmode=require
  SK_DATABASE_URL: ""
  # Optional — only set if /metrics should require a bearer token.
  SK_METRICS_TOKEN: ""
